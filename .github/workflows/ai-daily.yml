name: AI Daily Video (Free GitHub Runner)

on:
  push:
    branches: [main]
    paths:
      - 'ai-daily-src/**'
      - '.github/workflows/ai-daily.yml'
  schedule:
    # 00:07 UTC = 08:07 Shanghai, avoiding top-of-hour congestion.
    - cron: '7 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'demo = free silent test; live = RSS+GPT+TTS (requires OPENAI_API_KEY secret)'
        required: true
        type: choice
        default: free
        options:
          - demo
          - free
          - live

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-daily-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Choose demo or live without unexpected charges
        id: plan
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            MODE=free
          else
            MODE="${REQUESTED_MODE:-demo}"
          fi
          if [ "$MODE" = live ] && [ -z "$OPENAI_API_KEY" ]; then
            MODE=demo
            echo "No OpenAI API key: rendering offline demo instead."
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.plan.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install video fonts and FFmpeg
        if: steps.plan.outputs.skip == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install render dependencies
        if: steps.plan.outputs.skip == 'false'
        working-directory: ai-daily-src
        run: npm install --no-audit --no-fund

      - name: Install open-source local models (free mode)
        if: steps.plan.outputs.mode == 'free' && steps.plan.outputs.skip == 'false'
        run: |
          sudo apt-get install -y espeak-ng
          python3 -m pip install --break-system-packages --no-cache-dir "kokoro>=0.9.4" soundfile "numpy<2.3" misaki[zh]
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:11434/api/tags && break || sleep 2; done
          ollama pull qwen2.5:1.5b
      - name: Render MP4
        if: steps.plan.outputs.skip == 'false'
        working-directory: ai-daily-src
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OLLAMA_MODEL: qwen2.5:1.5b
          KOKORO_VOICE: zf_001
          GPT_MODEL: gpt-4.1-mini
          TTS_MODEL: gpt-4o-mini-tts
          TTS_VOICE: coral
        run: node generate.mjs

      - name: Verify video with ffprobe
        if: steps.plan.outputs.skip == 'false'
        run: |
          test -s ai-daily/latest.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height -of json ai-daily/latest.mp4

      - name: Prepare GitHub Pages directory
        if: steps.plan.outputs.skip == 'false'
        run: |
          mkdir -p .site/ai-daily
          cp index.html .site/index.html
          cp ai-daily/index.html ai-daily/latest.mp4 ai-daily/latest.sources.json .site/ai-daily/
          touch .site/.nojekyll

      - name: Upload Pages artifact
        if: steps.plan.outputs.skip == 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site

      - name: Deploy GitHub Pages
        if: steps.plan.outputs.skip == 'false'
        id: pages
        uses: actions/deploy-pages@v4
