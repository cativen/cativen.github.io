name: HEX2077 AI Daily Video (Free Runner)

on:
  push:
    branches: [main]
    paths:
      - 'ai-daily-src/**'
      - '.github/workflows/ai-daily.yml'
  schedule:
    # 00:07 UTC = 08:07 Shanghai, avoiding top-of-hour congestion.
    - cron: '7 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'free = HEX2077 daily + Qwen + Kokoro; demo = silent offline test'
        required: true
        type: choice
        default: free
        options:
          - demo
          - free

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-daily-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Select HEX2077 production or offline demo
        id: plan
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            MODE=free
          elif [ "$EVENT_NAME" = "push" ] && [[ "$COMMIT_MESSAGE" == *"[run free]"* ]]; then
            MODE=free
          else
            MODE="${REQUESTED_MODE:-demo}"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.plan.outputs.skip == 'false'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install video fonts and FFmpeg
        if: steps.plan.outputs.skip == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install render dependencies
        if: steps.plan.outputs.skip == 'false'
        working-directory: ai-daily-src
        run: npm install --no-audit --no-fund

      - name: Verify HEX article structure before downloading models
        if: steps.plan.outputs.mode == 'free' && steps.plan.outputs.skip == 'false'
        working-directory: ai-daily-src
        run: |
          node --test hex_source.test.mjs
          node --test cover.test.mjs
          node hex_preflight.mjs

      - name: Install open-source local models (free mode)
        if: steps.plan.outputs.mode == 'free' && steps.plan.outputs.skip == 'false'
        run: |
          sudo apt-get install -y espeak-ng
          python3 -m pip install --break-system-packages --no-cache-dir "kokoro>=0.9.4" soundfile "numpy<2.3" 'misaki[zh]'
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:11434/api/tags && break || sleep 2; done
          ollama pull qwen2.5:1.5b
      - name: Render MP4
        if: steps.plan.outputs.skip == 'false'
        working-directory: ai-daily-src
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OLLAMA_MODEL: qwen2.5:1.5b
          KOKORO_VOICE: zf_001
          GPT_MODEL: gpt-4.1-mini
          TTS_MODEL: gpt-4o-mini-tts
          TTS_VOICE: coral
        run: node generate.mjs

      - name: Verify video with ffprobe
        if: steps.plan.outputs.skip == 'false'
        run: |
          test -s ai-daily/latest.mp4
          test -s ai-daily/latest-cover.png
          file ai-daily/latest-cover.png
          ffprobe -v error -show_entries stream=codec_name,width,height -of json ai-daily/latest.mp4

      - name: Upload downloadable video and cover artifact
        if: steps.plan.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ai-daily-video-and-cover
          path: |
            ai-daily/latest.mp4
            ai-daily/latest-cover.png
            ai-daily/latest.sources.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Prepare GitHub Pages directory
        if: steps.plan.outputs.skip == 'false'
        run: |
          mkdir -p .site/ai-daily
          cp index.html .site/index.html
          cp ai-daily/index.html ai-daily/latest.mp4 ai-daily/latest.sources.json ai-daily/latest-cover.png .site/ai-daily/
          touch .site/.nojekyll

      - name: Upload Pages artifact
        if: steps.plan.outputs.skip == 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site

      - name: Deploy GitHub Pages
        if: steps.plan.outputs.skip == 'false'
        id: pages
        uses: actions/deploy-pages@v4
